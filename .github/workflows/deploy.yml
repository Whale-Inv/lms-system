name: CI/CD Pipeline

on:
  push:
    branches: ["develop"]
  pull_request:
    branches: ["develop"]

jobs:
  linter:
    name: lint with flake8
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      - name: Run flake8
        run: poetry run flake8 .

  test:
    name: Run Django tests
    runs-on: ubuntu-latest
    needs: linter

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      - name: Run tests
        run: poetry run python manage.py test
        env:
          DEBUG: True
          SECRET_KEY: dummy-secret-key-for-ci
          DATABASE_URL: sqlite:///db.sqlite3

  build:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build Docker image
        run: |
          docker build \
            --build-arg SECRET_KEY=dummy-build-secret \
            -t ${{ secrets.DOCKER_USERNAME }}/lms-system:${{ github.sha }} \
            -t ${{ secrets.DOCKER_USERNAME }}/lms-system:latest .

      - name: Push Docker image to Docker Hub
        run: docker push ${{ secrets.DOCKER_USERNAME }}/lms-system --all-tags

  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    needs: build
    if: success() && github.event_name == 'push' && github.ref == 'refs/heads/develop'

    steps:
      - name: Deploy via SSH
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
            cd /home/${{ secrets.SERVER_USER }}/lms-system
            
            # Останавливаем старые контейнеры
            docker compose down || true
            
            # Обновляем образ
            docker pull ${{ secrets.DOCKER_USERNAME }}/lms-system:latest
            
            # Запускаем контейнеры
            docker compose up -d
            
            # Применяем миграции
            docker exec lms-app python manage.py migrate --noinput || true
            
            # Очищаем старые образы
            docker system prune -f
            
            echo "Deployment completed!"
          EOF